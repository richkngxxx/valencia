<script>

// progress per lesson: 0..3 levels done. Migrate old "completed" list (= level 1 done).

Object.keys(state.levels).forEach(id => { if (!ALL.some(l => l.id === id)) delete state.levels[id]; });
const lvlOf = id => state.levels[id] || 0;
// ---- Streaks (local calendar days in Europe/Madrid) ----
const TZ = "Europe/Madrid", MILESTONES = [3, 7, 14, 30, 50, 100, 365], MAX_FREEZES = 2;

const numKey = n => new Date(n * 864e5).toISOString().slice(0, 10);

}
// called on every load/home: handle missed days (freeze or reset)
function reconcileStreak() {

  if (!sk.last || sk.cur === 0) return;
  const missed = t - keyNum(sk.last) - 1;
  if (missed <= 0) return;
  if (missed <= sk.freezes) {
    for (let i = 1; i <= missed; i++) sk.ice.push(numKey(keyNum(sk.last) + i));

const practisedToday = () => state.sk.last === todayKey() && state.sk.days.includes(todayKey());
// returns celebration info if this is the first completion today
function registerPractice() {
  reconcileStreak();

}
function save() {
  ls.setItem("valencia_xp", state.xp); ls.setItem("valencia_streak", state.streak); ls.setItem("valencia_lastday", state.lastDay); ls.setItem("valencia_streakdata", JSON.stringify(state.sk));
  ls.setItem("valencia_levels", JSON.stringify(state.levels)); ls.setItem("valencia_completed", JSON.stringify(Object.keys(state.levels))); ls.setItem("valencia_hearts", state.hearts); ls.setItem("valencia_heartts", state.heartTs);
}
function regen() {

  if (n > 0) { state.hearts = Math.min(MAX_HEARTS, state.hearts + n); state.heartTs += n * REGEN_MS; save(); }
}
function refill() { state.hearts = MAX_HEARTS; state.heartTs = Date.now(); save(); updateHeader(); showHome(); }
function updateHeader() {

  const fl = document.getElementById("streak"); fl.classList.toggle("off", !practisedToday());
  document.getElementById("xp").textContent = state.xp + " XP";

  document.getElementById("hearts").textContent = "❤️ " + state.hearts;
}
const currentIndex = () => ALL.findIndex(l => lvlOf(l.id) === 0);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }

const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const mascot = (pose, cls = "") => `<img class="m ${cls}" src="mascot/${pose}.png" alt="" aria-hidden="true">`;

  const cols = ["#58cc02", "#ffc800", "#1cb0f6", "#ff9600", "#ce82ff", "#ff4b4b"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("div"); c.className = "confetti";
    c.style.cssText = `left:${Math.random() * 100}vw;background:${cols[i % cols.length]};--x:${(Math.random() - .5) * 160}px;--r:${Math.random() * 900 - 450}deg;--d:${1.6 + Math.random() * 1.4}s;--delay:${Math.random() * .4}s`;

}
function tapNode(i) {

  state.selected = null; state.answered = false;

  if (ex.type === "learn") { const b = $("checkBtn"); b.disabled = false; b.textContent = "Continuar"; state.answered = true; }

const norm = t => t.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[’]/g, "'").replace(/[.!?¿¡,«»]/g, "").replace(/\s+/g, " ");

// ---- Phrasebook ("¿Cómo se dice…?") + DNV links ----
const DNV = w => "https://www.avl.gva.es/lexicval/?paraula=" + encodeURIComponent(w);
const STOP = new Set("el la els les l un una uns unes de del al a i o en per amb que es em et ens us li hi ho ne n no si sí molt més meu meua teu teua seu seua jo tu ell ella este esta eixe eixa s m t d".split(" "));
function mainWord(va) {
  const t = String(va).toLowerCase().replace(/[…!?¡¿.,;:«»"()]/g, " ").split(/[\s'’]+/).map(x => x.replace(/^-+|-+$/g, "")).filter(x => x && !STOP.has(x) && !/^\d+$/.test(x));
  if (!t.length) return null;
  const c = t.map(x => x.split("-")[0]).filter(x => x.length > 2);
  return (c.length ? c : t)[(c.length ? c : t).length - 1]; // last content word: usually the noun/adjective head
}
function dnvLink(va) {
  const w = mainWord(va); if (!w) return "";
  return `<a class="dnv-link" href="${DNV(w)}" target="_blank" rel="noopener">Ver «${esc(w)}» en el DNV (AVL) ↗</a>`;
}
const pnorm = t => String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/g, " ").replace(/\s+/g, " ").trim();
let PH = null, PM = null;
async function loadPhrases() {
  if (PH) return;
  const [a, b] = await Promise.all([fetch("phrases.json").then(r => r.json()), fetch("phrases_meta.json").then(r => r.json())]);
  PH = a; PM = b;
}
function stripQuery(q) {
  const quoted = q.match(/[«"“'‘]([^»"”'’]+)[»"”'’]/);
  if (quoted) return pnorm(quoted[1]);
  let n = pnorm(q);
  n = n.replace(/^(y |oye |una pregunta )?(como|que) (se dice|puedo decir|digo|se puede decir|diria|seria|se escribe|se traduce)( en valenciano)?( la (frase|palabra))? ?/, "");
  n = n.replace(/^(traduce|traduceme|traducir) /, "").replace(/ (en|al) valenciano$/, "").replace(/^(decir) /, "");
  return n.trim();
}
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 12) return 99;
  const d = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) { let prev = d[0]; d[0] = i; for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; } }
  return d[b.length];
}
function score(q, k) {

  const hit = qt.reduce((a, t) => a + fuzzyTok(t), 0);
  const dice = 2 * hit / (qt.length + kt.length);

function lookup(raw) {

  if (PH[q]) return { q, exact: q, near: related(q) };
  const near = Object.keys(PH).map(k => [k, score(q, k)]).filter(x => x[1] > .55).sort((a, b) => b[1] - a[1]).slice(0, 6).map(x => x[0]);
  return { q, exact: null, near };
}
function related(k) {
  const m = PM[k] || {}, toks = new Set(k.split(" ").filter(t => t.length > 3));

  const share = all.filter(x => x.split(" ").some(t => toks.has(t)));

const myQs = () => JSON.parse(ls.getItem("valencia_myqs") || "[]");

function phraseCard(k, big) {

const smallRow = k => `<button class="ph-row" onclick="showPhrase('${k.replace(/'/g, "")}')"><span>${esc((PM[k] || {}).es || k)}</span><b>${esc(PH[k])}</b></button>`;

    <div class="tabs" role="tablist">${[["ask", "Preguntar"], ["browse", "Frases"], ["mine", "Mis preguntas"]].map(([id, t]) => `<button role="tab" class="tab" id="tab-${id}" onclick="sheetTab('${id}')">${t}</button>`).join("")}</div>
