<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valencià — Aprende como Duolingo</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #f0f4f8;
  color: #1a1a1a;
  line-height: 1.5;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: white; box-shadow: 0 0 20px rgba(0,0,0,.1); }
header {
  background: #58cc02;
  color: white;
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header h1 { font-size: 1.6rem; font-weight: 700; }
.stats { display: flex; gap: 16px; font-weight: 600; }
main { padding: 20px; }
.home-title { text-align: center; margin-bottom: 24px; color: #58cc02; }
.level-section { margin-bottom: 28px; }
.level-section h2 { color: #333; margin-bottom: 12px; font-size: 1.2rem; }
.lesson-card {
  background: #fff;
  border: 2px solid #e5e5e5;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: all .2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.lesson-card:hover { border-color: #58cc02; transform: translateY(-2px); }
.lesson-card.completed { border-color: #58cc02; background: #f0fff0; }
.lesson-card .title { font-weight: 600; }
.lesson-card .meta { font-size: .85rem; color: #666; }
.progress-bar {
  height: 8px;
  background: #e5e5e5;
  border-radius: 4px;
  margin: 16px 0;
  overflow: hidden;
}
.progress-fill { height: 100%; background: #58cc02; transition: width .3s; }
.question { font-size: 1.25rem; font-weight: 600; margin: 20px 0; text-align: center; }
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  padding: 14px;
  border: 2px solid #e5e5e5;
  border-radius: 12px;
  background: white;
  cursor: pointer;
  text-align: left;
  font-size: 1rem;
  transition: all .15s;
}
.option { -webkit-tap-highlight-color: transparent; color: #1cb0f6; font-weight: 600; }
@media (hover: hover) { .option:not(:disabled):hover { background: #f7f7f7; } }
.option.selected { border-color: #1cb0f6; background: #ddf4ff; box-shadow: 0 2px 0 #1cb0f6; }
.option:disabled { cursor: default; }
.check-bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); background: #fff; border-top: 2px solid #eee; }
.check-bar.ok { background: #d7ffb8; border-top-color: #d7ffb8; }
.check-bar.bad { background: #ffdfe0; border-top-color: #ffdfe0; }
.check-bar .feedback { margin: 0 0 10px; text-align: left; }
.check-bar .feedback:empty { display: none; }
.check-bar .btn { margin-top: 0; }
.check-bar.bad .btn { background: #ff4b4b; }
.exercise-pad { height: 170px; }
.option.correct { border-color: #58cc02; background: #d4edda; }
.option.wrong { border-color: #ff4b4b; background: #f8d7da; }
.feedback { text-align: center; margin: 16px 0; font-weight: 600; min-height: 24px; }
.btn {
  display: block;
  width: 100%;
  padding: 14px;
  background: #58cc02;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 16px;
}
.btn:disabled { background: #ccc; cursor: not-allowed; }
.btn.secondary { background: #1cb0f6; }
.back-btn { background: none; border: none; color: #58cc02; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
.lesson-complete { text-align: center; padding: 40px 20px; }
.lesson-complete h2 { color: #58cc02; font-size: 2rem; margin-bottom: 12px; }
.input-answer {
  width: 100%;
  padding: 14px;
  border: 2px solid #e5e5e5;
  border-radius: 12px;
  font-size: 1.1rem;
  margin: 10px 0;
}
.input-answer:focus { outline: none; border-color: #58cc02; }
.hint { font-size: .9rem; color: #666; text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Valencià</h1>
      <div class="stats">
        <span id="xp">0 XP</span>
        <span id="streak">🔥 0</span>
        <span id="hearts">❤️ 5</span>
      </div>
    </header>
    <main id="main"></main>
  </div>
  <script>
const lessons = [
  {
    id: "a1-1",
    level: "A1",
    title: "Saludos y presentaciones",
    xp: 10,
    exercises: [
      { type: "mc", question: "¿Cómo se dice «Hola» en valenciano?", options: ["Hola", "Bon dia", "Adéu", "Gràcies"], answer: "Bon dia", explanation: "«Bon dia» es el saludo más común por la mañana." },
      { type: "mc", question: "«¿Cómo te llamas?»", options: ["Com et dius?", "Com estàs?", "On vas?", "Què fas?"], answer: "Com et dius?", explanation: "«Com et dius?» = ¿Cómo te llamas?" },
      { type: "type", question: "Traduce: «Me llamo Ana»", answer: "Em dic Ana", accept: ["em dic ana", "em dic Ana"], explanation: "Em dic + nombre." },
      { type: "mc", question: "«Encantado/a de conocerte»", options: ["Encantat de conéixer-te", "Bon dia", "Fins demà", "Moltes gràcies"], answer: "Encantat de conéixer-te", explanation: "Forma estándar AVL." },
      { type: "mc", question: "¿Cómo se dice «Adiós»?", options: ["Adéu", "Hola", "Bon dia", "Per favor"], answer: "Adéu", explanation: "«Adéu» es el adiós habitual." }
    ]
  },
  {
    id: "a1-2",
    level: "A1",
    title: "Números básicos",
    xp: 10,
    exercises: [
      { type: "mc", question: "¿Cómo se dice «uno»?", options: ["U", "Dos", "Tres", "Quatre"], answer: "U", explanation: "1 = u (masculino) / una (femenino)." },
      { type: "mc", question: "¿Cómo se dice «cinco»?", options: ["Cinc", "Sis", "Set", "Vuit"], answer: "Cinc", explanation: "5 = cinc." },
      { type: "type", question: "Escribe el número 10 en valenciano", answer: "deu", accept: ["deu"], explanation: "10 = deu." },
      { type: "mc", question: "«Hoy» en valenciano es…", options: ["Hui", "Avui", "Demà", "Ahir"], answer: "Hui", explanation: "En valenciano se prefiere «hui» (AVL)." },
      { type: "mc", question: "¿Cómo se dice «mañana»?", options: ["Demà", "Hui", "Ahir", "Ara"], answer: "Demà", explanation: "Demà = mañana." }
    ]
  },
  {
    id: "a1-3",
    level: "A1",
    title: "Familia",
    xp: 12,
    exercises: [
      { type: "mc", question: "«Madre»", options: ["Mare", "Pare", "Germana", "Iaia"], answer: "Mare", explanation: "Mare = madre." },
      { type: "mc", question: "«Padre»", options: ["Pare", "Mare", "Fill", "Avi"], answer: "Pare", explanation: "Pare = padre." },
      { type: "mc", question: "«Niño / chico»", options: ["Xiquet", "Xiqueta", "Home", "Dona"], answer: "Xiquet", explanation: "Xiquet es la forma valenciana típica." },
      { type: "type", question: "Traduce: «Mi hermana»", answer: "La meua germana", accept: ["la meua germana", "la meva germana"], explanation: "En valenciano se prefiere «meua»." },
      { type: "mc", question: "«Abuela»", options: ["Iaia", "Iaio", "Tia", "Cosina"], answer: "Iaia", explanation: "Iaia = abuela (muy usado)." }
    ]
  },
  {
    id: "a1-4",
    level: "A1",
    title: "Comida básica",
    xp: 12,
    exercises: [
      { type: "mc", question: "«Pan»", options: ["Pa", "Aigua", "Llet", "Formatge"], answer: "Pa", explanation: "Pa = pan." },
      { type: "mc", question: "«Agua»", options: ["Aigua", "Vi", "Café", "Suc"], answer: "Aigua", explanation: "Aigua = agua." },
      { type: "mc", question: "«Patata»", options: ["Creïlla", "Tomaca", "Ceba", "Pebre"], answer: "Creïlla", explanation: "Creïlla es la forma valenciana preferida." },
      { type: "type", question: "Traduce: «Quiero café»", answer: "Vull café", accept: ["vull cafe", "vull café", "vull un cafe"], explanation: "Vull = quiero." },
      { type: "mc", question: "«Gracias»", options: ["Gràcies", "Per favor", "De res", "Bon profit"], answer: "Gràcies", explanation: "Gràcies = gracias." }
    ]
  },
  {
    id: "a1-5",
    level: "A1",
    title: "Verbos básicos",
    xp: 15,
    exercises: [
      { type: "mc", question: "«Yo hablo»", options: ["Parle", "Parlo", "Parles", "Parla"], answer: "Parle", explanation: "En valenciano la 1ª persona es «parle» (AVL)." },
      { type: "mc", question: "«Voy»", options: ["Vaig", "Vas", "Va", "Anem"], answer: "Vaig", explanation: "Vaig = voy (verbo anar)." },
      { type: "mc", question: "«Soy» (permanente)", options: ["Soc", "Estic", "Vaig", "Tinc"], answer: "Soc", explanation: "Soc = soy (ser)." },
      { type: "type", question: "Traduce: «Estoy bien»", answer: "Estic bé", accept: ["estic be", "estic bé"], explanation: "Estic = estoy." },
      { type: "mc", question: "«Tengo»", options: ["Tinc", "Tens", "Té", "Tenim"], answer: "Tinc", explanation: "Tinc = tengo." }
    ]
  }
];

const levels = ["A1", "A2", "B1"];

let state = {
  xp: parseInt(localStorage.getItem("valencia_xp") || "0"),
  streak: parseInt(localStorage.getItem("valencia_streak") || "0"),
  hearts: 5,
  completed: JSON.parse(localStorage.getItem("valencia_completed") || "[]"),
  currentLesson: null,
  currentExercise: 0,
  correctInLesson: 0
};

function save() {
  localStorage.setItem("valencia_xp", state.xp);
  localStorage.setItem("valencia_streak", state.streak);
  localStorage.setItem("valencia_completed", JSON.stringify(state.completed));
}

function updateHeader() {
  document.getElementById("xp").textContent = state.xp + " XP";
  document.getElementById("streak").textContent = "🔥 " + state.streak;
  document.getElementById("hearts").textContent = "❤️ " + state.hearts;
}

function showHome() {
  const main = document.getElementById("main");
  let html = `<h2 class="home-title">Aprende valencià</h2>`;
  html += `<div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100, (state.completed.length / lessons.length) * 100)}%"></div></div>`;
  html += `<p style="text-align:center;color:#666;margin-bottom:20px">${state.completed.length} / ${lessons.length} lecciones completadas</p>`;

  levels.forEach(level => {
    const levelLessons = lessons.filter(l => l.level === level);
    if (levelLessons.length === 0) return;
    html += `<div class="level-section"><h2>${level}</h2>`;
    levelLessons.forEach(les => {
      const done = state.completed.includes(les.id);
      html += `<div class="lesson-card ${done ? "completed" : ""}" onclick="startLesson('${les.id}')">
        <div>
          <div class="title">${les.title}</div>
          <div class="meta">${les.exercises.length} ejercicios • ${les.xp} XP</div>
        </div>
        <div>${done ? "✅" : "▶️"}</div>
      </div>`;
    });
    html += `</div>`;
  });

  main.innerHTML = html;
  updateHeader();
}

function startLesson(id) {
  const lesson = lessons.find(l => l.id === id);
  if (!lesson) return;
  state.currentLesson = lesson;
  state.currentExercise = 0;
  state.correctInLesson = 0;
  state.hearts = 5;
  showExercise();
}

function showExercise() {
  const lesson = state.currentLesson;
  const ex = lesson.exercises[state.currentExercise];
  const main = document.getElementById("main");
  const progress = ((state.currentExercise) / lesson.exercises.length) * 100;

  let html = `<button class="back-btn" onclick="showHome()">← Salir</button>`;
  html += `<div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>`;
  html += `<div class="question">${ex.question}</div>`;

  if (ex.type === "mc") {
    html += `<div class="options">`;
    ex.options.forEach((opt, i) => {
      html += `<button class="option" data-i="${i}" onclick="selectOption(${i})">${opt}</button>`;
    });
    html += `</div>`;
  } else if (ex.type === "type") {
    html += `<input class="input-answer" id="answerInput" placeholder="Escribe en valenciano…" oninput="document.getElementById('checkBtn').disabled=!this.value.trim()" onkeypress="if(event.key==='Enter'&&this.value.trim())onCheck()">`;
  }
  html += `<div class="exercise-pad"></div>`;
  html += `<div class="check-bar" id="checkBar"><div class="feedback" id="feedback"></div><button class="btn" id="checkBtn" disabled onclick="onCheck()">Comprobar</button></div>`;
  state.selected = null; state.answered = false;
  main.innerHTML = html;
  if (document.activeElement) document.activeElement.blur();
  updateHeader();
}

function selectOption(i) {
  if (state.answered) return;
  state.selected = i;
  document.querySelectorAll(".option").forEach(b => b.classList.toggle("selected", +b.dataset.i === i));
  document.getElementById("checkBtn").disabled = false;
}

function onCheck() {
  if (state.answered) { next(); return; }
  const ex = state.currentLesson.exercises[state.currentExercise];
  const feedback = document.getElementById("feedback");
  const bar = document.getElementById("checkBar");
  let ok;
  if (ex.type === "mc") {
    if (state.selected === null) return;
    const sel = ex.options[state.selected];
    ok = sel === ex.answer;
    document.querySelectorAll(".option").forEach(b => {
      b.disabled = true; b.classList.remove("selected");
      const t = ex.options[+b.dataset.i];
      if (t === ex.answer) b.classList.add("correct");
      else if (+b.dataset.i === state.selected) b.classList.add("wrong");
    });
  } else {
    const input = document.getElementById("answerInput");
    const user = input.value.trim().toLowerCase();
    if (!user) return;
    ok = (ex.accept || [ex.answer]).map(a => a.toLowerCase()).includes(user);
    input.disabled = true;
  }
  state.answered = true;
  if (ok) {
    feedback.innerHTML = "✅ ¡Correcto! " + (ex.explanation || "");
    feedback.style.color = "#58a700";
    state.correctInLesson++;
    bar.classList.add("ok");
  } else {
    feedback.innerHTML = "❌ La respuesta es: <strong>" + ex.answer + "</strong><br>" + (ex.explanation || "");
    feedback.style.color = "#ea2b2b";
    state.hearts--;
    bar.classList.add("bad");
  }
  updateHeader();
  const btn = document.getElementById("checkBtn");
  btn.textContent = "Continuar"; btn.disabled = false;
}

function next() {
  if (state.hearts <= 0) {
    document.getElementById("main").innerHTML = `
      <div class="lesson-complete">
        <h2>💔</h2>
        <p>Te has quedado sin vidas. ¡Inténtalo de nuevo!</p>
        <button class="btn" onclick="startLesson('${state.currentLesson.id}')">Reintentar</button>
        <button class="btn secondary" onclick="showHome()">Volver</button>
      </div>`;
    return;
  }

  state.currentExercise++;
  if (state.currentExercise >= state.currentLesson.exercises.length) {
    finishLesson();
  } else {
    showExercise();
  }
}

function finishLesson() {
  const lesson = state.currentLesson;
  const ratio = state.correctInLesson / lesson.exercises.length;
  const earned = Math.round(lesson.xp * ratio);
  state.xp += earned;
  if (!state.completed.includes(lesson.id)) {
    state.completed.push(lesson.id);
    state.streak++;
  }
  save();

  document.getElementById("main").innerHTML = `
    <div class="lesson-complete">
      <h2>🎉 ¡Lección completada!</h2>
      <p>Has ganado <strong>${earned} XP</strong></p>
      <p>Aciertos: ${state.correctInLesson} / ${lesson.exercises.length}</p>
      <button class="btn" onclick="showHome()">Continuar</button>
    </div>`;
  updateHeader();
}

showHome();
  </script>
</body>
</html>
