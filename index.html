<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valencià — Aprende como Duolingo</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #f0f4f8;
  color: #1a1a1a;
  line-height: 1.5;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: white; box-shadow: 0 0 20px rgba(0,0,0,.1); }
header {
  background: #58cc02;
  color: white;
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header h1 { font-size: 1.6rem; font-weight: 700; }
.stats { display: flex; gap: 16px; font-weight: 600; }
main { padding: 20px; }
.home-title { text-align: center; margin-bottom: 24px; color: #58cc02; }
.level-section { margin-bottom: 28px; }
.level-section h2 { color: #333; margin-bottom: 12px; font-size: 1.2rem; }
.lesson-card {
  background: #fff;
  border: 2px solid #e5e5e5;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: all .2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.lesson-card:hover { border-color: #58cc02; transform: translateY(-2px); }
.lesson-card.completed { border-color: #58cc02; background: #f0fff0; }
.lesson-card .title { font-weight: 600; }
.lesson-card .meta { font-size: .85rem; color: #666; }
.progress-bar {
  height: 8px;
  background: #e5e5e5;
  border-radius: 4px;
  margin: 16px 0;
  overflow: hidden;
}
.progress-fill { height: 100%; background: #58cc02; transition: width .3s; }
.question { font-size: 1.25rem; font-weight: 600; margin: 20px 0; text-align: center; }
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  padding: 14px;
  border: 2px solid #e5e5e5;
  border-radius: 12px;
  background: white;
  cursor: pointer;
  text-align: left;
  font-size: 1rem;
  transition: all .15s;
}
.option { -webkit-tap-highlight-color: transparent; color: #1cb0f6; font-weight: 600; }
@media (hover: hover) { .option:not(:disabled):hover { background: #f7f7f7; } }
.option.selected { border-color: #1cb0f6; background: #ddf4ff; box-shadow: 0 2px 0 #1cb0f6; }
.option:disabled { cursor: default; }
.check-bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); background: #fff; border-top: 2px solid #eee; }
.check-bar.ok { background: #d7ffb8; border-top-color: #d7ffb8; }
.check-bar.bad { background: #ffdfe0; border-top-color: #ffdfe0; }
.check-bar .feedback { margin: 0 0 10px; text-align: left; }
.check-bar .feedback:empty { display: none; }
.check-bar .btn { margin-top: 0; }
.check-bar.bad .btn { background: #ff4b4b; }
.exercise-pad { height: 170px; }
.option.correct { border-color: #58cc02; background: #d4edda; }
.option.wrong { border-color: #ff4b4b; background: #f8d7da; }
.feedback { text-align: center; margin: 16px 0; font-weight: 600; min-height: 24px; }
.btn {
  display: block;
  width: 100%;
  padding: 14px;
  background: #58cc02;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 16px;
}
.btn:disabled { background: #ccc; cursor: not-allowed; }
.btn.secondary { background: #1cb0f6; }
.back-btn { background: none; border: none; color: #58cc02; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
.lesson-complete { text-align: center; padding: 40px 20px; }
.lesson-complete h2 { color: #58cc02; font-size: 2rem; margin-bottom: 12px; }
.input-answer {
  width: 100%;
  padding: 14px;
  border: 2px solid #e5e5e5;
  border-radius: 12px;
  font-size: 1.1rem;
  margin: 10px 0;
}
.input-answer:focus { outline: none; border-color: #58cc02; }
.learn-card { text-align: center; border: 2px solid #e5e5e5; border-radius: 16px; padding: 32px 16px; margin-top: 10px; }
.learn-word { font-size: 2rem; font-weight: 800; color: #1cb0f6; }
.learn-meaning { font-size: 1.2rem; margin-top: 8px; color: #4b4b4b; }
.hint { font-size: .9rem; color: #666; text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Valencià</h1>
      <div class="stats">
        <span id="xp">0 XP</span>
        <span id="streak">🔥 0</span>
        <span id="hearts">❤️ 5</span>
      </div>
    </header>
    <main id="main"></main>
  </div>
  <script>
const lessons = [
  {
    id: "a1-1", level: "A1", title: "Saludos y presentaciones", xp: 10,
    exercises: [
      { type: "learn", word: "Hola", meaning: "Hola", note: "Igual que en castellano." },
      { type: "learn", word: "Bon dia", meaning: "Buenos días", note: "El saludo más común por la mañana." },
      { type: "learn", word: "Adéu", meaning: "Adiós" },
      { type: "mc", question: "¿Cómo se dice «Buenos días»?", options: ["Bon dia", "Adéu", "Hola", "Bona nit"], answer: "Bon dia", explanation: "Bon dia = buenos días." },
      { type: "mc", question: "¿Cómo se dice «Adiós»?", options: ["Hola", "Adéu", "Bon dia", "Gràcies"], answer: "Adéu", explanation: "Adéu = adiós." },
      { type: "learn", word: "Com et dius?", meaning: "¿Cómo te llamas?" },
      { type: "learn", word: "Em dic…", meaning: "Me llamo…", note: "Em dic Ana = Me llamo Ana." },
      { type: "mc", question: "«¿Cómo te llamas?»", options: ["Com estàs?", "Com et dius?", "On vas?", "Què fas?"], answer: "Com et dius?", explanation: "Com et dius? = ¿Cómo te llamas?" },
      { type: "type", question: "Traduce: «Me llamo Ana»", answer: "Em dic Ana", explanation: "Em dic + nombre." },
      { type: "type", question: "Escribe «Adiós» en valenciano", answer: "Adéu", explanation: "Adéu = adiós." }
    ]
  },
  {
    id: "a1-2", level: "A1", title: "Números básicos", xp: 10,
    exercises: [
      { type: "learn", word: "U / una", meaning: "Uno / una", note: "1. «U» masculino, «una» femenino." },
      { type: "learn", word: "Dos", meaning: "Dos", note: "2" },
      { type: "learn", word: "Tres", meaning: "Tres", note: "3" },
      { type: "mc", question: "¿Cómo se dice «uno»?", options: ["Dos", "U", "Tres", "Cinc"], answer: "U", explanation: "1 = u." },
      { type: "learn", word: "Cinc", meaning: "Cinco", note: "5" },
      { type: "learn", word: "Deu", meaning: "Diez", note: "10" },
      { type: "mc", question: "¿Cómo se dice «cinco»?", options: ["Tres", "Deu", "Cinc", "Dos"], answer: "Cinc", explanation: "5 = cinc." },
      { type: "mc", question: "¿Qué número es «deu»?", options: ["2", "5", "10", "3"], answer: "10", explanation: "Deu = 10." },
      { type: "type", question: "Escribe el número 10 en valenciano", answer: "Deu", explanation: "10 = deu." },
      { type: "type", question: "Escribe el número 3 en valenciano", answer: "Tres", explanation: "3 = tres." }
    ]
  },
  {
    id: "a1-3", level: "A1", title: "Días", xp: 10,
    exercises: [
      { type: "learn", word: "Hui", meaning: "Hoy", note: "En valenciano se prefiere «hui»." },
      { type: "learn", word: "Demà", meaning: "Mañana (el día siguiente)" },
      { type: "learn", word: "Ahir", meaning: "Ayer" },
      { type: "mc", question: "«Hoy» en valenciano es…", options: ["Demà", "Hui", "Ahir", "Ara"], answer: "Hui", explanation: "Hui = hoy." },
      { type: "mc", question: "¿Qué significa «demà»?", options: ["Ayer", "Hoy", "Mañana", "Ahora"], answer: "Mañana", explanation: "Demà = mañana." },
      { type: "type", question: "Escribe «ayer» en valenciano", answer: "Ahir", explanation: "Ahir = ayer." }
    ]
  },
  {
    id: "a1-4", level: "A1", title: "Familia", xp: 12,
    exercises: [
      { type: "learn", word: "Mare", meaning: "Madre" },
      { type: "learn", word: "Pare", meaning: "Padre" },
      { type: "mc", question: "«Madre»", options: ["Pare", "Mare", "Germana", "Iaia"], answer: "Mare", explanation: "Mare = madre." },
      { type: "learn", word: "Germana", meaning: "Hermana", note: "Germà = hermano." },
      { type: "learn", word: "La meua", meaning: "Mi (femenino)", note: "La meua germana = mi hermana." },
      { type: "learn", word: "Iaia", meaning: "Abuela", note: "Iaio = abuelo." },
      { type: "mc", question: "«Abuela»", options: ["Mare", "Germana", "Iaia", "Pare"], answer: "Iaia", explanation: "Iaia = abuela." },
      { type: "mc", question: "«Hermana»", options: ["Germana", "Mare", "Iaia", "Pare"], answer: "Germana", explanation: "Germana = hermana." },
      { type: "type", question: "Traduce: «Mi hermana»", answer: "La meua germana", accept: ["la meua germana", "la meva germana", "meua germana"], explanation: "En valenciano se prefiere «meua»." },
      { type: "type", question: "Escribe «padre» en valenciano", answer: "Pare", explanation: "Pare = padre." }
    ]
  },
  {
    id: "a1-5", level: "A1", title: "Comida básica", xp: 12,
    exercises: [
      { type: "learn", word: "Pa", meaning: "Pan" },
      { type: "learn", word: "Aigua", meaning: "Agua" },
      { type: "mc", question: "«Agua»", options: ["Pa", "Aigua", "Café", "Creïlla"], answer: "Aigua", explanation: "Aigua = agua." },
      { type: "learn", word: "Creïlla", meaning: "Patata", note: "La forma valenciana más usada." },
      { type: "learn", word: "Vull", meaning: "Quiero", note: "Vull café = quiero café." },
      { type: "learn", word: "Gràcies", meaning: "Gracias" },
      { type: "mc", question: "«Patata»", options: ["Pa", "Creïlla", "Aigua", "Vull"], answer: "Creïlla", explanation: "Creïlla = patata." },
      { type: "mc", question: "¿Qué significa «vull»?", options: ["Tengo", "Quiero", "Voy", "Soy"], answer: "Quiero", explanation: "Vull = quiero." },
      { type: "type", question: "Traduce: «Quiero café»", answer: "Vull café", accept: ["vull cafe", "vull café", "vull un cafe", "vull un café"], explanation: "Vull = quiero." },
      { type: "type", question: "Escribe «gracias» en valenciano", answer: "Gràcies", explanation: "Gràcies = gracias." }
    ]
  },
  {
    id: "a1-6", level: "A1", title: "Verbos básicos", xp: 15,
    exercises: [
      { type: "learn", word: "Parle", meaning: "Hablo", note: "En valenciano la 1ª persona acaba en -e." },
      { type: "learn", word: "Vaig", meaning: "Voy" },
      { type: "mc", question: "«Yo hablo»", options: ["Parles", "Parle", "Parla", "Vaig"], answer: "Parle", explanation: "Parle = hablo." },
      { type: "learn", word: "Soc", meaning: "Soy" },
      { type: "learn", word: "Estic", meaning: "Estoy", note: "Estic bé = estoy bien." },
      { type: "learn", word: "Tinc", meaning: "Tengo" },
      { type: "mc", question: "«Soy»", options: ["Estic", "Soc", "Tinc", "Vaig"], answer: "Soc", explanation: "Soc = soy." },
      { type: "mc", question: "«Tengo»", options: ["Soc", "Vaig", "Tinc", "Parle"], answer: "Tinc", explanation: "Tinc = tengo." },
      { type: "type", question: "Traduce: «Estoy bien»", answer: "Estic bé", accept: ["estic be", "estic bé"], explanation: "Estic = estoy, bé = bien." },
      { type: "type", question: "Escribe «voy» en valenciano", answer: "Vaig", explanation: "Vaig = voy." }
    ]
  }
];

const levels = ["A1", "A2", "B1"];

let state = {
  xp: parseInt(localStorage.getItem("valencia_xp") || "0"),
  streak: parseInt(localStorage.getItem("valencia_streak") || "0"),
  hearts: 5,
  completed: JSON.parse(localStorage.getItem("valencia_completed") || "[]"),
  currentLesson: null,
  currentExercise: 0,
  correctInLesson: 0
};

function save() {
  localStorage.setItem("valencia_xp", state.xp);
  localStorage.setItem("valencia_streak", state.streak);
  localStorage.setItem("valencia_completed", JSON.stringify(state.completed));
}

function updateHeader() {
  document.getElementById("xp").textContent = state.xp + " XP";
  document.getElementById("streak").textContent = "🔥 " + state.streak;
  document.getElementById("hearts").textContent = "❤️ " + state.hearts;
}

function showHome() {
  const main = document.getElementById("main");
  let html = `<h2 class="home-title">Aprende valencià</h2>`;
  html += `<div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100, (state.completed.length / lessons.length) * 100)}%"></div></div>`;
  html += `<p style="text-align:center;color:#666;margin-bottom:20px">${state.completed.length} / ${lessons.length} lecciones completadas</p>`;

  levels.forEach(level => {
    const levelLessons = lessons.filter(l => l.level === level);
    if (levelLessons.length === 0) return;
    html += `<div class="level-section"><h2>${level}</h2>`;
    levelLessons.forEach(les => {
      const done = state.completed.includes(les.id);
      html += `<div class="lesson-card ${done ? "completed" : ""}" onclick="startLesson('${les.id}')">
        <div>
          <div class="title">${les.title}</div>
          <div class="meta">${les.exercises.filter(e=>e.type!=='learn').length} ejercicios • ${les.xp} XP</div>
        </div>
        <div>${done ? "✅" : "▶️"}</div>
      </div>`;
    });
    html += `</div>`;
  });

  main.innerHTML = html;
  updateHeader();
}

function startLesson(id) {
  const lesson = lessons.find(l => l.id === id);
  if (!lesson) return;
  state.currentLesson = lesson;
  state.currentExercise = 0;
  state.correctInLesson = 0;
  state.hearts = 5;
  showExercise();
}

function showExercise() {
  const lesson = state.currentLesson;
  const ex = lesson.exercises[state.currentExercise];
  const main = document.getElementById("main");
  const progress = ((state.currentExercise) / lesson.exercises.length) * 100;

  let html = `<button class="back-btn" onclick="showHome()">← Salir</button>`;
  html += `<div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>`;
  html += `<div class="question">${ex.question}</div>`;

  if (ex.type === "mc") {
    html += `<div class="options">`;
    ex.options.forEach((opt, i) => {
      html += `<button class="option" data-i="${i}" onclick="selectOption(${i})">${opt}</button>`;
    });
    html += `</div>`;
  } else if (ex.type === "learn") {
    html = html.replace(`<div class="question">${ex.question}</div>`, `<div class="question">Palabra nueva</div>`);
    html += `<div class="learn-card"><div class="learn-word">${ex.word}</div><div class="learn-meaning">${ex.meaning}</div>${ex.note ? `<div class="hint">${ex.note}</div>` : ""}</div>`;
  } else if (ex.type === "type") {
    html += `<input class="input-answer" id="answerInput" placeholder="Escribe en valenciano…" oninput="document.getElementById('checkBtn').disabled=!this.value.trim()" onkeypress="if(event.key==='Enter'&&this.value.trim())onCheck()">`;
  }
  html += `<div class="exercise-pad"></div>`;
  html += `<div class="check-bar" id="checkBar"><div class="feedback" id="feedback"></div><button class="btn" id="checkBtn" disabled onclick="onCheck()">Comprobar</button></div>`;
  state.selected = null; state.answered = false;
  main.innerHTML = html;
  if (ex.type === "learn") { const b = document.getElementById("checkBtn"); b.disabled = false; b.textContent = "Continuar"; state.answered = true; }
  if (document.activeElement) document.activeElement.blur();
  updateHeader();
}

function selectOption(i) {
  if (state.answered) return;
  state.selected = i;
  document.querySelectorAll(".option").forEach(b => b.classList.toggle("selected", +b.dataset.i === i));
  document.getElementById("checkBtn").disabled = false;
}

function onCheck() {
  if (state.answered) { next(); return; }
  const ex = state.currentLesson.exercises[state.currentExercise];
  const feedback = document.getElementById("feedback");
  const bar = document.getElementById("checkBar");
  let ok;
  if (ex.type === "mc") {
    if (state.selected === null) return;
    const sel = ex.options[state.selected];
    ok = sel === ex.answer;
    document.querySelectorAll(".option").forEach(b => {
      b.disabled = true; b.classList.remove("selected");
      const t = ex.options[+b.dataset.i];
      if (t === ex.answer) b.classList.add("correct");
      else if (+b.dataset.i === state.selected) b.classList.add("wrong");
    });
  } else {
    const input = document.getElementById("answerInput");
    const norm = t => t.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[.!?¿¡,]/g, "").replace(/\s+/g, " ");
    const user = norm(input.value);
    if (!user) return;
    ok = (ex.accept || [ex.answer]).map(norm).includes(user);
    input.disabled = true;
  }
  state.answered = true;
  if (ok) {
    feedback.innerHTML = "✅ ¡Correcto! " + (ex.explanation || "");
    feedback.style.color = "#58a700";
    state.correctInLesson++;
    bar.classList.add("ok");
  } else {
    feedback.innerHTML = "❌ La respuesta es: <strong>" + ex.answer + "</strong><br>" + (ex.explanation || "");
    feedback.style.color = "#ea2b2b";
    state.hearts--;
    bar.classList.add("bad");
  }
  updateHeader();
  const btn = document.getElementById("checkBtn");
  btn.textContent = "Continuar"; btn.disabled = false;
}

function next() {
  if (state.hearts <= 0) {
    document.getElementById("main").innerHTML = `
      <div class="lesson-complete">
        <h2>💔</h2>
        <p>Te has quedado sin vidas. ¡Inténtalo de nuevo!</p>
        <button class="btn" onclick="startLesson('${state.currentLesson.id}')">Reintentar</button>
        <button class="btn secondary" onclick="showHome()">Volver</button>
      </div>`;
    return;
  }

  state.currentExercise++;
  if (state.currentExercise >= state.currentLesson.exercises.length) {
    finishLesson();
  } else {
    showExercise();
  }
}

function finishLesson() {
  const lesson = state.currentLesson;
  const graded = lesson.exercises.filter(e=>e.type!=='learn').length;
  const ratio = state.correctInLesson / graded;
  const earned = Math.round(lesson.xp * ratio);
  state.xp += earned;
  if (!state.completed.includes(lesson.id)) {
    state.completed.push(lesson.id);
    state.streak++;
  }
  save();

  document.getElementById("main").innerHTML = `
    <div class="lesson-complete">
      <h2>🎉 ¡Lección completada!</h2>
      <p>Has ganado <strong>${earned} XP</strong></p>
      <p>Aciertos: ${state.correctInLesson} / ${lesson.exercises.filter(e=>e.type!=='learn').length}</p>
      <button class="btn" onclick="showHome()">Continuar</button>
    </div>`;
  updateHeader();
}

showHome();
  </script>
</body>
</html>
